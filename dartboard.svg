<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Border Circle (Dark) -->
  <circle cx="100" cy="100" r="95" fill="#1F2937" filter="url(#shadow)"/>

  <!-- Outer Ring Segments (Black and Cream alternating with black border) -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#000" stroke-width="2"/>
  
  <!-- Black and Cream outer segments -->
  <g id="outer-segments">
    <circle cx="100" cy="18" r="8" fill="#1F2937"/>
    <circle cx="143" cy="32" r="8" fill="#F3F4F6"/>
    <circle cx="168" cy="57" r="8" fill="#1F2937"/>
    <circle cx="182" cy="100" r="8" fill="#F3F4F6"/>
    <circle cx="168" cy="143" r="8" fill="#1F2937"/>
    <circle cx="143" cy="168" r="8" fill="#F3F4F6"/>
    <circle cx="100" cy="182" r="8" fill="#1F2937"/>
    <circle cx="57" cy="168" r="8" fill="#F3F4F6"/>
    <circle cx="32" cy="143" r="8" fill="#1F2937"/>
    <circle cx="18" cy="100" r="8" fill="#F3F4F6"/>
    <circle cx="32" cy="57" r="8" fill="#1F2937"/>
    <circle cx="57" cy="32" r="8" fill="#F3F4F6"/>
  </g>

  <!-- Triple Ring (Gold/Yellow border) -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#F59E0B" stroke-width="4"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#000" stroke-width="1"/>

  <!-- Single Play Area - Cream background -->
  <circle cx="100" cy="100" r="69" fill="#F3F4F6"/>
  
  <!-- Double Ring (Red border) -->
  <circle cx="100" cy="100" r="38" fill="none" stroke="#DC2626" stroke-width="4"/>
  <circle cx="100" cy="100" r="33" fill="none" stroke="#000" stroke-width="1"/>

  <!-- Inner Single Play Area - Black -->
  <circle cx="100" cy="100" r="32" fill="#1F2937"/>

  <!-- Bull's Eye (Outer ring - Green) -->
  <circle cx="100" cy="100" r="18" fill="#059669"/>
  <circle cx="100" cy="100" r="16" fill="none" stroke="#000" stroke-width="1"/>

  <!-- Bull's Eye (Inner - Red) -->
  <circle cx="100" cy="100" r="12" fill="#EF4444"/>

  <!-- Segment dividing lines (bold) -->
  <g id="segments" stroke="#000" stroke-width="1.5" opacity="0.5">
    <line x1="100" y1="10" x2="100" y2="190"/>
    <line x1="100" y1="10" x2="100" y2="190" transform="rotate(18 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="190" transform="rotate(36 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="190" transform="rotate(54 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="190" transform="rotate(72 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="190" transform="rotate(90 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="190" transform="rotate(108 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="190" transform="rotate(126 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="190" transform="rotate(144 100 100)"/>
    <line x1="100" y1="10" x2="100" y2="190" transform="rotate(162 100 100)"/>
  </g>

  <!-- Number Labels (Bold and Cartoon style) -->
  <text x="100" y="18" text-anchor="middle" font-size="14" font-weight="bold" fill="#F59E0B" font-family="Arial">20</text>
  <text x="157" y="35" text-anchor="middle" font-size="14" font-weight="bold" fill="#F59E0B" font-family="Arial">1</text>
  <text x="177" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#F59E0B" font-family="Arial">18</text>
  <text x="182" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#F59E0B" font-family="Arial">4</text>
  <text x="177" y="143" text-anchor="middle" font-size="14" font-weight="bold" fill="#F59E0B" font-family="Arial">13</text>
  <text x="157" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#F59E0B" font-family="Arial">6</text>
  <text x="100" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#F59E0B" font-family="Arial">10</text>
  <text x="43" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#F59E0B" font-family="Arial">15</text>
  <text x="23" y="143" text-anchor="middle" font-size="14" font-weight="bold" fill="#F59E0B" font-family="Arial">2</text>
  <text x="18" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#F59E0B" font-family="Arial">17</text>
  <text x="23" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#F59E0B" font-family="Arial">3</text>
  <text x="43" y="35" text-anchor="middle" font-size="14" font-weight="bold" fill="#F59E0B" font-family="Arial">19</text>

  <!-- Highlight/Shine effect on bull's eye for cartoon look -->
  <circle cx="95" cy="95" r="3" fill="white" opacity="0.6"/>
  
  <!-- Cartoon star/sparkle around bull's eye -->
  <path d="M100,75 L102,85 L112,87 L104,93 L106,103 L100,99 L94,103 L96,93 L88,87 L98,85 Z" fill="#FCD34D" opacity="0.3"/>
</svg>