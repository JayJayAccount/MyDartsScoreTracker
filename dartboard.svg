<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Outer Bull's Eye (Red) -->
  <circle cx="100" cy="100" r="12" fill="#EF4444"/>
  
  <!-- Outer Bull Ring (Black/Green) -->
  <circle cx="100" cy="100" r="18" fill="none" stroke="#1F2937" stroke-width="2"/>
  <circle cx="100" cy="100" r="17" fill="none" stroke="#059669" stroke-width="1"/>
  
  <!-- Double Ring (outer) -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#1F2937" stroke-width="4"/>
  
  <!-- Triple Ring -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#1F2937" stroke-width="3"/>
  
  <!-- Single Areas (alternating black and cream) -->
  <circle cx="100" cy="100" r="68" fill="#F3F4F6"/>
  <circle cx="100" cy="100" r="38" fill="#1F2937"/>
  
  <!-- Dartboard segments (20 sections) -->
  <g id="segments">
    <!-- Segment dividers -->
    <line x1="100" y1="20" x2="100" y2="180" stroke="#374151" stroke-width="0.5"/>
    <line x1="100" y1="20" x2="100" y2="180" stroke="#374151" stroke-width="0.5" transform="rotate(9 100 100)"/>
    <line x1="100" y1="20" x2="100" y2="180" stroke="#374151" stroke-width="0.5" transform="rotate(18 100 100)"/>
    <line x1="100" y1="20" x2="100" y2="180" stroke="#374151" stroke-width="0.5" transform="rotate(27 100 100)"/>
    <line x1="100" y1="20" x2="100" y2="180" stroke="#374151" stroke-width="0.5" transform="rotate(36 100 100)"/>
    <line x1="100" y1="20" x2="100" y2="180" stroke="#374151" stroke-width="0.5" transform="rotate(45 100 100)"/>
    <line x1="100" y1="20" x2="100" y2="180" stroke="#374151" stroke-width="0.5" transform="rotate(54 100 100)"/>
    <line x1="100" y1="20" x2="100" y2="180" stroke="#374151" stroke-width="0.5" transform="rotate(63 100 100)"/>
    <line x1="100" y1="20" x2="100" y2="180" stroke="#374151" stroke-width="0.5" transform="rotate(72 100 100)"/>
    <line x1="100" y1="20" x2="100" y2="180" stroke="#374151" stroke-width="0.5" transform="rotate(81 100 100)"/>
    <line x1="100" y1="20" x2="100" y2="180" stroke="#374151" stroke-width="0.5" transform="rotate(90 100 100)"/>
    <line x1="100" y1="20" x2="100" y2="180" stroke="#374151" stroke-width="0.5" transform="rotate(99 100 100)"/>
    <line x1="100" y1="20" x2="100" y2="180" stroke="#374151" stroke-width="0.5" transform="rotate(108 100 100)"/>
    <line x1="100" y1="20" x2="100" y2="180" stroke="#374151" stroke-width="0.5" transform="rotate(117 100 100)"/>
    <line x1="100" y1="20" x2="100" y2="180" stroke="#374151" stroke-width="0.5" transform="rotate(126 100 100)"/>
    <line x1="100" y1="20" x2="100" y2="180" stroke="#374151" stroke-width="0.5" transform="rotate(135 100 100)"/>
    <line x1="100" y1="20" x2="100" y2="180" stroke="#374151" stroke-width="0.5" transform="rotate(144 100 100)"/>
    <line x1="100" y1="20" x2="100" y2="180" stroke="#374151" stroke-width="0.5" transform="rotate(153 100 100)"/>
    <line x1="100" y1="20" x2="100" y2="180" stroke="#374151" stroke-width="0.5" transform="rotate(162 100 100)"/>
    <line x1="100" y1="20" x2="100" y2="180" stroke="#374151" stroke-width="0.5" transform="rotate(171 100 100)"/>
  </g>
  
  <!-- Numbers around the board (20 section values) -->
  <text x="100" y="15" text-anchor="middle" font-size="10" font-weight="bold" fill="#F59E0B">20</text>
  <text x="154" y="28" text-anchor="middle" font-size="10" font-weight="bold" fill="#F59E0B">1</text>
  <text x="177" y="50" text-anchor="middle" font-size="10" font-weight="bold" fill="#F59E0B">18</text>
  <text x="185" y="76" text-anchor="middle" font-size="10" font-weight="bold" fill="#F59E0B">4</text>
  <text x="177" y="103" text-anchor="middle" font-size="10" font-weight="bold" fill="#F59E0B">13</text>
  <text x="154" y="127" text-anchor="middle" font-size="10" font-weight="bold" fill="#F59E0B">6</text>
  <text x="120" y="150" text-anchor="middle" font-size="10" font-weight="bold" fill="#F59E0B">10</text>
  <text x="80" y="165" text-anchor="middle" font-size="10" font-weight="bold" fill="#F59E0B">15</text>
  <text x="46" y="150" text-anchor="middle" font-size="10" font-weight="bold" fill="#F59E0B">2</text>
  <text x="23" y="127" text-anchor="middle" font-size="10" font-weight="bold" fill="#F59E0B">17</text>
  <text x="15" y="103" text-anchor="middle" font-size="10" font-weight="bold" fill="#F59E0B">3</text>
  <text x="23" y="76" text-anchor="middle" font-size="10" font-weight="bold" fill="#F59E0B">19</text>
  <text x="46" y="50" text-anchor="middle" font-size="10" font-weight="bold" fill="#F59E0B">7</text>
  <text x="80" y="28" text-anchor="middle" font-size="10" font-weight="bold" fill="#F59E0B">16</text>
</svg>